# TODO: Remove this branch-only workflow after the provider startup failure is diagnosed.
name: Diagnose runtime probe
on:
  push:
    branches: [dev/kevinlin/diagnose-provider-probe]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@0f22cb304de7760de58ecc4d277de6a19d4c3fac
        with:
          node-version: 24.16.0
          cache-mode: read-write
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - run: bash scripts/ci/setup-tools.sh k3d
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/diagnose-runtime-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-probe-evidence
          path: ${{ runner.temp }}/probe-evidence
          retention-days: 3
