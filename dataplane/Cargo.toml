# Modified for OpenClaw Enterprise.
# Selected DNS, admission, policy, and TLS packages for OCE model custody.
# Product builds select the two explicit OCE binary targets.
[workspace]
resolver = "2"
members = [
  "crates/ds-contracts",
  "crates/policy-core",
  "crates/ds-policy-snapshot",
  "crates/ds-admission-shm",
  "crates/ds-telemetry",
  "crates/ds-nft",
  "services/ds-dnsgate",
  "services/ds-tlsproxy",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.48", default-features = false }
hickory-server = { version = "0.26", default-features = false }
hickory-resolver = { version = "0.26", default-features = false }
hickory-proto = { version = "0.26", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
