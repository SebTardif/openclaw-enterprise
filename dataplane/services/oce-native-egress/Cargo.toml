[package]
name = "oce-native-egress"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[dependencies]
x509-parser = "=0.18.1"
ds-credentials = { path = "../../crates/ds-credentials" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
http = "1"
httparse = "=1.10.1"
serde = "1"
serde_json = "1"
ring = "0.17"
base64 = "0.22"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
zeroize = { workspace = true }

bytes = { version = "=1.11.1", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[[bin]]
name = "oce-github-read"
path = "src/bin/oce-github-read.rs"
