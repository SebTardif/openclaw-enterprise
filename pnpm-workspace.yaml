# Verification commands must never prepare or repair dependencies implicitly.
verifyDepsBeforeRun: error

allowBuilds:
  esbuild@0.18.20: true
  esbuild@0.25.12: true
  esbuild@0.28.2: true

packages:
  - apps/controller
  - apps/gateway
  - packages/utils
  - packages/contracts
  - packages/occ
  - packages/iam
  - packages/audit
  - "!legacy/**"
