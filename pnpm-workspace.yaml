packages:
  - apps/controller
  - packages/utils
  - packages/contracts
  - packages/occ
  - packages/iam
  - packages/audit
  - "!legacy/**"

# Wait seven days before accepting registry releases, including locked versions.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  esbuild: true
  protobufjs: true

# TODO: Remove these temporary pins when the registry permits the upstream versions.
overrides:
  "@better-auth/core": 1.7.3
  zod: 4.5.4
