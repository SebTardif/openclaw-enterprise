# Shared operational-log policy. Receivers and exporter configuration are separate
# native Collector files; no application reads exporter credentials.
extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 16
  transform/operational:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          # Retain only transport-derived identity before examining untrusted JSON.
          - keep_keys(attributes, ["service.name", "service.instance.id", "service.version", "container.id", "openclaw.namespace.id", "openclaw.agent.id", "openclaw.revision.id", "log.iostream"])
          - set(cache["record"], ParseJSON(body)) where IsString(body) and Len(body) <= 32768
          - set(attributes["event.name"], cache["record"]["event"]) where IsMap(cache["record"]) and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["event"]) and IsMatch(cache["record"]["event"], "^(listening|startup-error|http[.]completed|http[.]unexpected_error|worker[.](started|stopped|health|completed|error|startup-error)|installation[.](bootstrapped|already-bootstrapped|bootstrap-failed)|migration[.](completed|failed))$$")
          - set(attributes["event.name"], cache["record"]["event"]) where IsMap(cache["record"]) and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and cache["record"]["diagnosticSchema"] == "operational-diagnostics/v1" and IsString(cache["record"]["event"]) and IsMatch(cache["record"]["event"], "^diagnostics[.](lifecycle|condition|operation|security)$$")
          - set(attributes["event.name"], "gateway.operational") where IsMap(cache["record"]) and attributes["service.name"] == "openclaw-gateway" and IsString(cache["record"]["subsystem"]) and IsMatch(cache["record"]["subsystem"], "^gateway(/|$$)")
          - set(attributes["event.name"], "codex.operational") where IsMap(cache["record"]) and attributes["service.name"] == "codex-app-server" and attributes["log.iostream"] == "stderr" and IsString(cache["record"]["target"]) and IsMatch(cache["record"]["target"], "^codex_app_server(::|$$)")
          - set(attributes["request.id"], cache["record"]["requestId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["requestId"]) and IsMatch(cache["record"]["requestId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.namespace.id"], cache["record"]["namespaceId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["namespaceId"]) and IsMatch(cache["record"]["namespaceId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.agent.id"], cache["record"]["agentId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["agentId"]) and IsMatch(cache["record"]["agentId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.revision.id"], cache["record"]["revisionId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["revisionId"]) and IsMatch(cache["record"]["revisionId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.code"], cache["record"]["code"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["code"]) and IsMatch(cache["record"]["code"], "^[A-Z][A-Z0-9_]{0,63}$$")
          - set(attributes["http.request.method"], cache["record"]["method"]) where attributes["event.name"] == "http.completed" and IsString(cache["record"]["method"]) and IsMatch(cache["record"]["method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$$")
          - set(attributes["http.response.status_code"], Int(cache["record"]["status"])) where attributes["event.name"] == "http.completed" and (IsInt(cache["record"]["status"]) or IsDouble(cache["record"]["status"])) and cache["record"]["status"] >= 100 and cache["record"]["status"] <= 599
          - set(attributes["duration_ms"], cache["record"]["durationMs"]) where attributes["event.name"] == "http.completed" and (IsInt(cache["record"]["durationMs"]) or IsDouble(cache["record"]["durationMs"])) and cache["record"]["durationMs"] >= 0 and cache["record"]["durationMs"] <= 600000
          - set(attributes["work.attempt"], Int(cache["record"]["attempt"])) where attributes["service.name"] == "occ-worker" and (IsInt(cache["record"]["attempt"]) or IsDouble(cache["record"]["attempt"])) and cache["record"]["attempt"] >= 0 and cache["record"]["attempt"] <= 1000
          - set(attributes["work.outcome"], cache["record"]["outcome"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["outcome"]) and IsMatch(cache["record"]["outcome"], "^(success|failure|ready|activated|pending|retry|permanent|superseded)$$")
          - set(attributes["work.id"], cache["record"]["workId"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["workId"]) and IsMatch(cache["record"]["workId"], "^(namespace|agent_revision):[a-z_]+_[a-f0-9-]{36}:[a-z_]+(:(ready|deleted|[0-9]+))?$$")
          - set(attributes["work.operation"], cache["record"]["operation"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["operation"]) and IsMatch(cache["record"]["operation"], "^(agent_revision[.]reconcile|namespace[.](ensure|delete)|work[.]reconcile)$$")
          # Canonical diagnostic values remain log attributes. They never replace
          # transport identity or Engine/CRI time and are not durable audit receipts.
          - set(attributes["diagnostic.installation_id"], cache["record"]["installationId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["installationId"]) and IsMatch(cache["record"]["installationId"], "^(ins_)?[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.operation_ref"], cache["record"]["operationRef"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["operationRef"]) and IsMatch(cache["record"]["operationRef"], "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.security_event_id"], cache["record"]["securityEventId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["securityEventId"]) and IsMatch(cache["record"]["securityEventId"], "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.attempt_id"], cache["record"]["attemptId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["attemptId"]) and IsMatch(cache["record"]["attemptId"], "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.assignment_id"], cache["record"]["assignmentId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["assignmentId"]) and IsMatch(cache["record"]["assignmentId"], "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.requested_revision_id"], cache["record"]["requestedRevisionId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["requestedRevisionId"]) and IsMatch(cache["record"]["requestedRevisionId"], "^rev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.selected_revision_id"], cache["record"]["selectedRevisionId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["selectedRevisionId"]) and IsMatch(cache["record"]["selectedRevisionId"], "^rev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.serving_revision_id"], cache["record"]["servingRevisionId"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["servingRevisionId"]) and IsMatch(cache["record"]["servingRevisionId"], "^rev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$")
          - set(attributes["diagnostic.lifecycle_generation"], Int(cache["record"]["lifecycleGeneration"])) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and (IsInt(cache["record"]["lifecycleGeneration"]) or IsDouble(cache["record"]["lifecycleGeneration"])) and cache["record"]["lifecycleGeneration"] == Int(cache["record"]["lifecycleGeneration"]) and cache["record"]["lifecycleGeneration"] >= 0 and cache["record"]["lifecycleGeneration"] <= 9007199254740991
          - set(attributes["diagnostic.observed_lifecycle_generation"], Int(cache["record"]["observedLifecycleGeneration"])) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and (IsInt(cache["record"]["observedLifecycleGeneration"]) or IsDouble(cache["record"]["observedLifecycleGeneration"])) and cache["record"]["observedLifecycleGeneration"] == Int(cache["record"]["observedLifecycleGeneration"]) and cache["record"]["observedLifecycleGeneration"] >= 0 and cache["record"]["observedLifecycleGeneration"] <= 9007199254740991
          - set(attributes["diagnostic.runtime_generation"], Int(cache["record"]["runtimeGeneration"])) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and (IsInt(cache["record"]["runtimeGeneration"]) or IsDouble(cache["record"]["runtimeGeneration"])) and cache["record"]["runtimeGeneration"] == Int(cache["record"]["runtimeGeneration"]) and cache["record"]["runtimeGeneration"] >= 0 and cache["record"]["runtimeGeneration"] <= 9007199254740991
          - set(attributes["diagnostic.attempt"], Int(cache["record"]["attempt"])) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and (IsInt(cache["record"]["attempt"]) or IsDouble(cache["record"]["attempt"])) and cache["record"]["attempt"] == Int(cache["record"]["attempt"]) and cache["record"]["attempt"] >= 0 and cache["record"]["attempt"] <= 9007199254740991
          - set(attributes["diagnostic.accepted_at"], cache["record"]["acceptedAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["acceptedAt"]) and IsMatch(cache["record"]["acceptedAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.observed_at"], cache["record"]["observedAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["observedAt"]) and IsMatch(cache["record"]["observedAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.recorded_at"], cache["record"]["recordedAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["recordedAt"]) and IsMatch(cache["record"]["recordedAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.occurred_at"], cache["record"]["occurredAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["occurredAt"]) and IsMatch(cache["record"]["occurredAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.received_at"], cache["record"]["receivedAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["receivedAt"]) and IsMatch(cache["record"]["receivedAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.retry_at"], cache["record"]["retryAt"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["retryAt"]) and IsMatch(cache["record"]["retryAt"], "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$$")
          - set(attributes["diagnostic.observed_at_available"], false) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](condition|operation|security)$$")
          - set(attributes["diagnostic.observed_at_available"], true) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](condition|operation|security)$$") and attributes["diagnostic.observed_at"] != nil
          - set(attributes["diagnostic.recorded_at_available"], false) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](condition|operation)$$")
          - set(attributes["diagnostic.recorded_at_available"], true) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](condition|operation)$$") and attributes["diagnostic.recorded_at"] != nil
          - set(attributes["diagnostic.serving"], cache["record"]["serving"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsBool(cache["record"]["serving"])
          - set(attributes["diagnostic.stop_complete"], cache["record"]["stopComplete"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsBool(cache["record"]["stopComplete"])
          - set(attributes["diagnostic.desired_mode"], cache["record"]["desiredMode"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["desiredMode"]) and IsMatch(cache["record"]["desiredMode"], "^(running|disabled|stopped)$$")
          - set(attributes["diagnostic.phase"], cache["record"]["phase"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["phase"]) and IsMatch(cache["record"]["phase"], "^(pending|reconciling|blocked|converged|superseded|requested|accepted|observed|unknown)$$")
          - set(attributes["diagnostic.step"], cache["record"]["step"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["step"]) and IsMatch(cache["record"]["step"], "^(observe|deny-predecessor|terminate-predecessor|prepare|activate|publish|cleanup)$$")
          - set(attributes["diagnostic.reason_code"], cache["record"]["reasonCode"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["reasonCode"]) and IsMatch(cache["record"]["reasonCode"], "^(NONE|LIFECYCLE_UNINITIALIZED|NOT_OBSERVED|NOT_REQUESTED|AUTHORITY_DENIED|DEPENDENCY_UNAVAILABLE|PROFILE_UNAVAILABLE|PREDECESSOR_UNRESOLVED|CREATE_OUTCOME_UNKNOWN|AMBIGUOUS_PROVIDER_INSTANCE|ROUTE_OUTCOME_UNKNOWN|TERMINATION_UNKNOWN|CREDENTIAL_OUTCOME_UNKNOWN|STATE_UNAVAILABLE|RESTORE_OUTCOME_UNKNOWN|SUPERSEDED|RECONCILIATION_EXHAUSTED|Authorized|AccessDenied|IdentityUnresolved|WrongScope|StaleGeneration|IdentityRegistered|IdentityRotated|IdentityReplaced|PolicyRejected|CredentialAllowed|CredentialDenied|RequestReceived|DurablyAccepted|Serving|Disabled|StopUnconfirmed|Stopped|ProviderConfirmed|Expired|RuntimeUnreachable|Queued|Busy|Duplicate|Interrupted|AuditUnavailable|ResourceLimitExceeded|Unknown)$$")
          - set(attributes["diagnostic.retention"], cache["record"]["retention"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["retention"]) and IsMatch(cache["record"]["retention"], "^(retained|verification-pending|unknown)$$")
          - set(attributes["diagnostic.condition"], cache["record"]["condition"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["condition"]) and IsMatch(cache["record"]["condition"], "^(accessDenied|routeRemoved|executionTerminated|credentialRevocation|stateRetention)$$")
          - set(attributes["diagnostic.condition_status"], cache["record"]["conditionStatus"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["conditionStatus"]) and IsMatch(cache["record"]["conditionStatus"], "^(confirmed|pending|unknown|not-requested)$$")
          - set(attributes["diagnostic.operation_kind"], cache["record"]["operationKind"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["operationKind"]) and IsMatch(cache["record"]["operationKind"], "^(deploy|disable|stop|resume)$$")
          - set(attributes["diagnostic.source"], cache["record"]["source"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["source"]) and IsMatch(cache["record"]["source"], "^(api|occ|gateway|identity|credential|runtime)$$")
          - set(attributes["diagnostic.category"], cache["record"]["category"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["category"]) and IsMatch(cache["record"]["category"], "^(management|access|credential|identity|lifecycle|dispatch|confinement)$$")
          - set(attributes["diagnostic.action"], cache["record"]["action"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["action"]) and IsMatch(cache["record"]["action"], "^(create|read|update|delete|deploy|operate|administer|issue|use|register|rotate|replace|expire|disable|revoke|stop|admit|cancel)$$")
          - set(attributes["diagnostic.decision"], cache["record"]["decision"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["decision"]) and IsMatch(cache["record"]["decision"], "^(allowed|denied|not_applicable|unknown)$$")
          - set(attributes["diagnostic.result"], cache["record"]["result"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["result"]) and IsMatch(cache["record"]["result"], "^(pending|completed|denied|failed|queued|busy|duplicate|interrupted|revoked|expired|unknown)$$")
          - set(attributes["diagnostic.observation_source"], cache["record"]["observationSource"]) where IsString(attributes["event.name"]) and IsMatch(attributes["event.name"], "^diagnostics[.](lifecycle|condition|operation|security)$$") and IsString(cache["record"]["observationSource"]) and IsMatch(cache["record"]["observationSource"], "^(controller|runtime|identity_provider|credential_provider|gateway)$$")
          - set(cache["level"], cache["record"]["severity"]) where IsMap(cache["record"])
          - set(cache["level"], cache["record"]["level"]) where IsMap(cache["record"]) and cache["level"] == nil
          - set(severity_number, SEVERITY_NUMBER_DEBUG) where cache["level"] == "debug" or cache["level"] == "DEBUG" or cache["level"] == 20
          - set(severity_number, SEVERITY_NUMBER_INFO) where cache["level"] == "info" or cache["level"] == "INFO" or cache["level"] == 30
          - set(severity_number, SEVERITY_NUMBER_WARN) where cache["level"] == "warn" or cache["level"] == "WARN" or cache["level"] == 40
          - set(severity_number, SEVERITY_NUMBER_ERROR) where cache["level"] == "error" or cache["level"] == "ERROR" or cache["level"] == 50
          - set(severity_text, "DEBUG") where severity_number == SEVERITY_NUMBER_DEBUG
          - set(severity_text, "INFO") where severity_number == SEVERITY_NUMBER_INFO
          - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
          - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
          # Time comes from the Engine/CRI envelope; arbitrary runtime message text
          # and fields never become the remote body or resource identity.
          - set(body, attributes["event.name"])
  filter/operational:
    error_mode: propagate
    logs:
      log_record:
        - 'attributes["event.name"] == nil'
        - "severity_number == SEVERITY_NUMBER_UNSPECIFIED"
        - 'attributes["service.name"] == "codex-app-server" and attributes["log.iostream"] != "stderr"'
  groupbyattrs/identity:
    keys:
      - service.name
      - service.instance.id
      - service.version
      - container.id
      - openclaw.namespace.id
      - openclaw.agent.id
      - openclaw.revision.id
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: error
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
